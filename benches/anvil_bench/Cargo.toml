# CEP:FILE: benches/anvil_bench/Cargo.toml
# CEP:WHAT: Manifest for the Anvil benchmark harness binary.
# CEP:WHY: CEP&CC 32.10 (benchmarks mirror hot code) + Law 4 evidence.
# CEP:CLASS: CEP-2
# CEP:STATUS: complete
# CEP:FAILURE: build-time errors only.
# CEP:ASSUMES: workspace lints apply.
