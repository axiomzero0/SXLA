# CEP:FILE: .github/workflows/ci.yml
# CEP:WHAT: SXLA continuous integration — build, test, clippy, fmt, CEP lint,
#          and the sanitizer matrix as HARD gates. Benchmark evidence lives
#          in .github/workflows/bench.yml (always-on: push, PR, daily).
# CEP:WHY: CEP&CC 2.3 (mechanical enforcement), 6.3 (warnings-as-errors),
#          6.6 (sanitizers in CI), 16 (CI can block non-compliant merges).
# CEP:CLASS: CEP-2
# CEP:STATUS: complete (session 6: sanitizer legs promoted from
#          continue-on-error to hard gates — both races that the soft gate
#          had been tolerating were reproduced locally, fixed, and the
#          matrix verified clean under TSan halt_on_error=1 and ASan).
# CEP:FAILURE: any gate failing fails the workflow.
# CEP:ASSUMES: pinned toolchain from rust-toolchain.toml for build-test; the
#          sanitizer matrix pins nightly-2026-10-25 (the nightly verified
#          locally with -Zbuild-std TSan; advance the pin deliberately with
#          a local verification run — floating nightlies silently broke the
#          TSan leg before this pin).
# CEP:COST: CI minutes; offline cacheable build (zero deps).
# CEP:EVIDENCE: workflow runs themselves are the artifact register; the
#          session-6 run is the first with the sanitizer legs hard.
# CEP:SECURITY: pinned actions by major tag; no secrets needed.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build + test + clippy + fmt + cep-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build (warnings-as-errors via workspace lints)
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: CEP comment-field lint (CEP&CC 10.2/10.10)
        run: python3 scripts/cep_lint.py crates tools benches tests

  sanitizers:
    name: sanitizers (${{ matrix.sanitizer }} — hard gate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            build-std: ""
          - sanitizer: thread
            build-std: "-Zbuild-std"
    env:
      RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
      # TSan must halt on the first race or a data race would pass silently
      # (verified locally: the default prints and exits 0). ASan halts by
      # default and ignores TSAN_OPTIONS.
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-25
          components: rust-src
      - name: Build workspace bins (integration tests spawn them)
        # The bins must exist as RUNNABLE binaries: `cargo test --tests`
        # compiles tools only as test targets. The TSan leg builds std from
        # source (rustc hard-errors on instrumented crates linked against
        # uninstrumented std otherwise).
        run: cargo +nightly-2026-10-25 build --workspace --target x86_64-unknown-linux-gnu ${{ matrix.build-std }}
      - name: Test under ${{ matrix.sanitizer }}
        run: cargo +nightly-2026-10-25 test --workspace --tests --target x86_64-unknown-linux-gnu ${{ matrix.build-std }}
